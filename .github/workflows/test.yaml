jobs:
  CHECK_CHANGES:
    name: Check for file changes
    runs-on: ubuntu-latest
    outputs:
      stg: ${{ steps.grep-stg-changed-files.outputs.any_changed }}
      prod: ${{ steps.grep-prod-changed-files.outputs.any_changed }}
    steps:
      - uses: actions/checkout@v4.1.7
      - name: Get changed files
        id: stg-changed-files
        run: 
          echo "any_changed=wdp-namdl-stg-eus2-synw/gfiuwiuf" 
