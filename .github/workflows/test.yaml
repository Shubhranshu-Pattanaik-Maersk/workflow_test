      - name: Grep changed files for staging
        id: grep-stg-changed-files
        run: |
          echo "any_changed = "${{ steps.stg-changed-files.outputs.any_changed }}" | grep 'wdp-namdl-stg-eus2-synw/'" >> "$GITHUB_OUTPUT"
